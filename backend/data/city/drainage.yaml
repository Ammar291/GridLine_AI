    current_capacity_m3s: 7.5
    blocked_fraction: 0.12
    condition: fair
    last_desilted: "2018-11-20"
    outfall_river_id: R-1
    outfall_channel_id: null
    limiting_structure_id: TU-1
    limiting_structure_kind: tunnel
    gate_closes_at_river_stage_m: null
    description: >-
      Culvert draining Station Road (Z-SR) south to the Kalinadi (R-1). It is constricted where it passes beside the
      Station Road rail underpass (TU-1), whose sump pumps PU-T1 and PU-T2 discharge into it.
  - id: D-7
    name: Kalinadi drain
    kind: lined_channel
    catchment_id: CT-2
    upstream_zone_id: Z-HV
