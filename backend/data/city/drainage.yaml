    condition: poor
    last_desilted: "2021-03-15"
    outfall_river_id: R-1
    outfall_channel_id: null
    limiting_structure_id: null
    limiting_structure_kind: null
    gate_closes_at_river_stage_m: null
    description: >-
      Open channel draining Mill Road Industrial (Z-MI) to the Kalinadi (R-1). The 2025 survey found it a quarter
      blocked with silt and industrial waste; the Mill Road settlement lines its banks.

