    outfall_river_id: R-1
    outfall_channel_id: null
    limiting_structure_id: BR-4
    limiting_structure_kind: bridge
    gate_closes_at_river_stage_m: null
    description: >-
      The lined channel that carries all Hillview (Z-HV) and Tekri Heights runoff down to Riverside (Z-RS) and the
      Kalinadi (R-1), receiving D-8 on the way. Its capacity is set by the BR-4 box culvert under Hill Road (RD-01),
      rebuilt in 2025 at 2.4 x 1.8 m (previously 3.2 x 2.4 m). Level sensor CL-D7 is at BR-4.
  - id: D-8
    name: Riverside outfall drain
    kind: storm_drain
    catchment_id: CT-2
    upstream_zone_id: Z-RS
    downstream_zone_id: Z-RS
    x_m: 8800
    y_m: 3600
    length_m: 1900
    year_built: 1998
    year_relined: null
    design_capacity_m3s: 15
    current_capacity_m3s: 13
