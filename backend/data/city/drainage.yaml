    condition: poor
    last_desilted: "2025-03-31"
    outfall_river_id: R-1
    outfall_channel_id: null
    limiting_structure_id: BR-5
    limiting_structure_kind: bridge
    gate_closes_at_river_stage_m: null
    description: >-
      The 1890 brick culvert under Old Town (Z-OT) that carries D-4 and D-2 flows to the Kalinadi (R-1) through the
      FP-3 embankment. Its narrowest section is the heritage Bazaar arch bridge (BR-5). Phase 1 desilting under
      PR-D3R was completed in 2025 and relining is in progress; level sensor CL-D3 is at BR-5.
  - id: D-4
    name: Market Ward drain
    kind: covered_drain
    catchment_id: CT-3
    upstream_zone_id: Z-MW
    downstream_zone_id: Z-OT
    x_m: 6200
    y_m: 4900
    length_m: 2600
    year_built: 1938
    year_relined: 1999
    design_capacity_m3s: 12
    current_capacity_m3s: 10
    blocked_fraction: 0.08
    condition: fair
    last_desilted: "2024-05-06"
    outfall_river_id: null
    outfall_channel_id: D-3
    limiting_structure_id: null
    limiting_structure_kind: null
    gate_closes_at_river_stage_m: null
    description: >-
      Covered drain under Market Ward (Z-MW) that receives D-2 from Civil Lines and discharges into D-3 in Old Town.
      The Market Ward Mall site (PR-MWM) lies 25 m away and pumps its dewatering flow into it.
  - id: D-5
    name: Station Road drain
    kind: culvert
    catchment_id: CT-3
