    condition: fair
    last_desilted: "2023-05-22"
    outfall_river_id: null
    outfall_channel_id: D-7
    limiting_structure_id: null
    limiting_structure_kind: null
    gate_closes_at_river_stage_m: 4.0
    description: >-
      Storm drain serving the Riverside (Z-RS) flood plain, discharging into the lower reach of D-7 through a flap
      gate that closes when the Kalinadi (R-1) stage reaches 4.0 m. Encroachment by the D-8 settlement has narrowed
      it.
  - id: D-9
    name: New Colony drain
    kind: lined_channel
    catchment_id: CT-5
    upstream_zone_id: Z-NC
    downstream_zone_id: Z-NC
    x_m: 6000
    y_m: 2000
    length_m: 4200
    year_built: 2019
    year_relined: null
    design_capacity_m3s: 20
    current_capacity_m3s: 20
    blocked_fraction: 0.00
    condition: good
    last_desilted: "2025-05-12"
    outfall_river_id: R-1
    outfall_channel_id: null
    limiting_structure_id: null
    limiting_structure_kind: null
    gate_closes_at_river_stage_m: null
    description: >-
      Lined channel built in 2019 for the New Colony Housing Scheme (PR-NCH), designed for a 35 % impervious
      catchment. It drains New Colony (Z-NC) north to the Kalinadi (R-1) across the South Bank plain (FP-2).
  - id: D-11
    name: Lakeside pumped drain
    kind: pumped_drain
    catchment_id: CT-4
    upstream_zone_id: Z-LK
    downstream_zone_id: Z-LK
    x_m: 2600
    y_m: 2200
    length_m: 1600
    year_built: 1996
    year_relined: null
    design_capacity_m3s: 12
    current_capacity_m3s: 9.5
    blocked_fraction: 0.05
    condition: fair
    last_desilted: "2024-04-25"
    outfall_river_id: R-1
    outfall_channel_id: null
    limiting_structure_id: DM-2
    limiting_structure_kind: dam
    gate_closes_at_river_stage_m: 2.5
    description: >-
      Drains Nandi Lake (R-3) and Lakeside (Z-LK) to the Kalinadi (R-1) through the Nandi Lake Regulator (DM-2).
      Design capacity is 3 fixed pumps of 2.5 m3/s (PU-L1..PU-L3) plus 4.5 m3/s by gravity, but gravity discharge
      works only while the river stage is below 1.5 m. PU-L2 failed on 2024-10-28, leaving 9.5 m3/s.
  - id: D-12
    name: Mill Road industrial drain
    kind: open_channel
    catchment_id: CT-5
    upstream_zone_id: Z-MI
    downstream_zone_id: Z-MI
    x_m: 10200
    y_m: 2000
    length_m: 3000
