  equipment: field triage tents, 2 ALS kits, portable oxygen
  baseline_response_min: 15
  description: Medical team attached to Nandipur District Hospital H-1 on Civil Lines Road (RD-10); sets up field
    triage at shelters and incident sites.

- id: C-6
  name: Electrical Repair Crew
  kind: electrical
  members: 9
  base_zone_id: Z-CL
  location_zone_id: Z-CL
  x_m: 6000
  y_m: 6800
