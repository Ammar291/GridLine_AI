  y_m: 6200
  status: available
  capabilities: [search_and_rescue, rope_rescue, cutting, boat_rescue, first_aid]
  equipment: ropes, hydraulic cutting tools, 2 inflatable boats, first-aid kits, 2 rescue vans
  baseline_response_min: 20
  description: General rescue crew based in Civil Lines on Civil Lines Road (RD-10), near shelter S-1 and hospital
    H-1.

- id: C-2
