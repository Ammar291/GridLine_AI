# Nandipur emergency resources (synthetic). Spec section 5.7. elevation_m is computed at seed time.
# Live columns (status, available beds, occupancy) hold their initial seed values.

hospitals:
- id: H-1
  name: Nandipur District Hospital
  kind: tertiary
  zone_id: Z-CL
  x_m: 6400
  y_m: 6600
  year_built: 1968
  floors: 6
  has_burn_unit: false
  has_helipad: true
  backup_power_hours: 72
  access_road_id: RD-10
  substation_id: PS-1
  water_facility_id: WF-1
  status: normal
  description: The city's tertiary referral hospital on Civil Lines Road (RD-10), fed from the grid substation PS-1
    and supplied by WF-1. It received 36 patients evacuated from H-2 in 2021 and takes burn overflow from H-5.

- id: H-2
  name: Riverside Community Hospital
  kind: community
  zone_id: Z-RS
  x_m: 8800
  y_m: 3800
  year_built: 1996
  floors: 3
  has_burn_unit: false
  has_helipad: false
  backup_power_hours: 12
  access_road_id: RD-02
  substation_id: PS-2
  water_facility_id: WF-2
  status: normal
  description: Community hospital beside the Riverside Bypass (RD-02) on flood plain FP-1, a short distance from
    drain D-8. Powered by substation PS-2 with 12 hours of generator fuel and supplied from intake WF-2.

- id: H-3
  name: Railway Hospital
  kind: district
  zone_id: Z-SR
  x_m: 2800
  y_m: 5200
  year_built: 1948
  floors: 3
  has_burn_unit: false
  has_helipad: false
  backup_power_hours: 24
  access_road_id: RD-04
  substation_id: PS-4
  water_facility_id: WF-1
  status: normal
  description: District hospital of the Station Road railway colony on Station Road (RD-04), powered from PS-4 and
    supplied by WF-1; the rail underpass TU-1 and drain D-5 lie south-east of it.

- id: H-4
  name: Lakeview Hospital
  kind: private
  zone_id: Z-LK
  x_m: 1400
  y_m: 2200
  year_built: 2009
  floors: 5
  has_burn_unit: false
  has_helipad: false
  backup_power_hours: 36
  access_road_id: RD-07
  substation_id: PS-5
  water_facility_id: WF-5
  status: normal
  description: Private hospital on the Lakeside Ring Road (RD-07) inside the Nandi Lake basin FP-4. Powered from
    PS-5, the same substation that feeds the D-11 pumps; its ground floor took water in 2016 and 2024.

- id: H-5
  name: Mill Road Workers' Hospital
  kind: specialist
  zone_id: Z-MI
  x_m: 10000
  y_m: 1900
  year_built: 1984
  floors: 4
  has_burn_unit: true
  has_helipad: false
  backup_power_hours: 48
  access_road_id: RD-08
  substation_id: PS-3
  water_facility_id: WF-1
  status: normal
  description: Specialist industrial-injury hospital on Mill Road (RD-08) with the city's only burn unit (16 beds),
    powered from PS-3 and supplied by WF-1; drain D-12 runs to its north.

