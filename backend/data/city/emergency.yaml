  equipment: mobile pumps PU-M1 to PU-M4, debris grabs, sandbags, 2 flatbed trucks
  baseline_response_min: 30
  description: Drainage crew at the Old Town works yard that operates the mobile pumps PU-M1 to PU-M4 and clears
    drains D-3 and D-4; deployed pumps to the D-7 outfall in 2025.

- id: C-3
  name: Road Maintenance Crew
  kind: road
  members: 16
  base_zone_id: Z-SR
  location_zone_id: Z-SR
