  equipment: excavator, 2 dump trucks, barricades, traffic cones, chainsaws
  baseline_response_min: 35
  description: Road crew based at the Station Road depot off Station Road (RD-04); clears landslide debris from
    Hill Road (RD-01) and Tekri Quarry Road (RD-11) and staffs closures at the TU-1 underpass.

- id: C-4
  name: Hill Rescue Team
  kind: hill_rescue
  members: 12
  base_zone_id: Z-RS
  location_zone_id: Z-RS
  x_m: 9600
  y_m: 4400
  status: available
  capabilities: [rope_rescue, slope_inspection, landslide_search, first_aid]
  equipment: rope rescue kit, slope inclinometer, search cameras, 1 four-wheel-drive van
  baseline_response_min: 25
  description: Team formed in 2020 after the Hill Road landslide, stationed at the foot of Hill Road (RD-01) where
    RD-10 meets it; inspects slopes SL-HV-1 to SL-HV-3 and reads probes SM-01 to SM-03.

- id: C-5
  name: Medical Response Team
  kind: medical
  members: 10
  base_zone_id: Z-CL
