    emergency_number: "112"
    description: >-
      Nandipur is a fictional river city of about 344,700 people on both banks of the Kalinadi (R-1) in the
      Kalinadi Valley. The north bank holds the historic Old Town (Z-OT), Market Ward (Z-MW), Station Road (Z-SR)
      and Civil Lines (Z-CL), rising east to the Hillview (Z-HV) slopes and Tekri Heights (Z-TH) under Tekri Hill
      (HL-1). The south bank holds the Nandi Lake basin (Z-LK), the fast-growing New Colony (Z-NC) and the Mill Road
      Industrial area (Z-MI). The river is regulated upstream by the Kalinadi Barrage (DM-1) and gauged at Kalinadi
      Bridge (RV-01, gauge zero 207.0 m).
