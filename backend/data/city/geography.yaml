    soil_type: lateritic gravel over shale
    depth_to_bedrock_m: 6.0
    permeability_class: moderate
    infiltration_rate_mm_h: 18
    field_capacity: 0.25
    plasticity_index: 12
    shrink_swell: low
    liquefaction_susceptibility: none
    bearing_capacity_kpa: 250
    water_table_depth_m: 8.0
    notes: Well-drained lateritic cover over shale; shale is exposed on the Civil Lines scarp (SL-CL-1).
  - id: SP-LK
    zone_id: Z-LK
    soil_type: lacustrine clay and peat
    depth_to_bedrock_m: 30.0
    permeability_class: very_low
    infiltration_rate_mm_h: 2
    field_capacity: 0.48
    plasticity_index: 35
    shrink_swell: high
    liquefaction_susceptibility: low
    bearing_capacity_kpa: 45
    water_table_depth_m: 0.8
    notes: Ground surface lies only a few metres above lake level; soils stay waterlogged for weeks after heavy rain.
  - id: SP-NC
    zone_id: Z-NC
    soil_type: alluvial silt (former paddy)
    depth_to_bedrock_m: 20.0
    permeability_class: low
    infiltration_rate_mm_h: 10
    field_capacity: 0.38
    plasticity_index: 14
    shrink_swell: moderate
    liquefaction_susceptibility: moderate
    bearing_capacity_kpa: 85
    water_table_depth_m: 1.5
    notes: Former paddy fields with a compacted plough pan; shallow water table across the South Bank plain (FP-2).
  - id: SP-MI
    zone_id: Z-MI
    soil_type: alluvial sand and gravel
    depth_to_bedrock_m: 16.0
    permeability_class: high
    infiltration_rate_mm_h: 25
    field_capacity: 0.18
    plasticity_index: 5
    shrink_swell: low
    liquefaction_susceptibility: moderate
    bearing_capacity_kpa: 150
    water_table_depth_m: 2.5
    notes: Permeable sands allow rapid groundwater rise during river floods; industrial fill covers much of the zone.

