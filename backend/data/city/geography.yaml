  - id: SP-MW
    zone_id: Z-MW
    soil_type: clay loam
    depth_to_bedrock_m: 14.0
    permeability_class: moderate
    infiltration_rate_mm_h: 10
    field_capacity: 0.33
    plasticity_index: 15
    shrink_swell: moderate
    liquefaction_susceptibility: low
    bearing_capacity_kpa: 180
    water_table_depth_m: 5.0
    notes: Deep basements need dewatering below about 5 m, as at the Market Ward Mall site (PR-MWM).
  - id: SP-SR
    zone_id: Z-SR
    soil_type: silty loam over railway fill
    depth_to_bedrock_m: 12.0
    permeability_class: moderate
    infiltration_rate_mm_h: 11
    field_capacity: 0.30
    plasticity_index: 11
    shrink_swell: low
    liquefaction_susceptibility: low
    bearing_capacity_kpa: 160
    water_table_depth_m: 4.0
    notes: Up to 3 m of compacted railway fill near the tracks; the TU-1 underpass floor lies close to the water table.
  - id: SP-CL
