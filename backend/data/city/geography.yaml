geological_zones:
  - id: GZ-1
    name: Tekri Quartzite Ridge
    lithology: hard massive quartzite with thin residual soils
    description: >-
      The crest and upper flanks of Tekri Hill (HL-1) in Tekri Heights (Z-TH). Hard quartzite with less than 1.5 m
      of residual soil; rock is exposed on the Tekri Quarry face (SL-TH-1).
    permeability_class: very_low
    bearing_capacity_class: very_high
    hazard_notes: Rockfall and wedge failures on cuts and quarry benches; very high runoff that feeds the D-7 head and R-2.
  - id: GZ-2
    name: Hillview Phyllite Slopes
    lithology: weathered phyllite under 2-6 m of colluvial silty clay
    description: >-
      The Hillview spur (HL-2) in Z-HV. Weathered phyllite with foliation dipping to the south-west, parallel to the
      slope, covered by 2-6 m of colluvium that drains towards D-7.
    permeability_class: low
    bearing_capacity_class: moderate
    hazard_notes: Dip slope to the SW; colluvium becomes slide-prone when saturated; perched water table after heavy rain.
  - id: GZ-3
    name: Kalinadi Recent Alluvium
    lithology: loose to medium-dense silt, sand and gravel deposited by the Kalinadi
    description: >-
      Recent alluvium on both banks of the Kalinadi (R-1), under Riverside (Z-RS), Old Town (Z-OT), New Colony (Z-NC)
      and Mill Road Industrial (Z-MI); it forms the flood plains FP-1, FP-2 and FP-3.
    permeability_class: moderate
    bearing_capacity_class: low
    hazard_notes: High water table; moderate liquefaction susceptibility in saturated sands; active flood plain.
  - id: GZ-4
    name: Older Alluvial Terrace
    lithology: compact older alluvium, clay loam and lateritic gravel over shale
    description: >-
      The raised terrace north of the river under Market Ward (Z-MW), Station Road (Z-SR) and Civil Lines (Z-CL),
      including the Civil Lines Rise (HL-3).
    permeability_class: moderate
    bearing_capacity_class: high
    hazard_notes: Compact and generally stable with good bearing; local shale scarp at SL-CL-1.
  - id: GZ-5
    name: Nandi Lacustrine Basin
    lithology: soft lacustrine clay with peat lenses
    description: >-
      The closed basin of Nandi Lake (R-3) under Lakeside (Z-LK); about 30 m of soft clay and peat lie over the
      alluvium.
    permeability_class: very_low
    bearing_capacity_class: low
    hazard_notes: Soft clay and peat with poor bearing; long-term subsidence; chronic waterlogging; drains only by pumping at high river stage.

soil_profiles:
  - id: SP-HV
    zone_id: Z-HV
    soil_type: colluvial silty clay over weathered phyllite
    depth_to_bedrock_m: 4.5
    permeability_class: low
    infiltration_rate_mm_h: 8
    field_capacity: 0.34
    plasticity_index: 22
    shrink_swell: moderate
    liquefaction_susceptibility: none
    bearing_capacity_kpa: 120
    water_table_depth_m: 3.0
    notes: Water table 3 m but perched close to the surface after heavy rain; colluvium thickens towards the D-7 valley.
  - id: SP-TH
    zone_id: Z-TH
    soil_type: thin residual soil over quartzite
    depth_to_bedrock_m: 1.2
    permeability_class: low
    infiltration_rate_mm_h: 12
    field_capacity: 0.22
    plasticity_index: 9
    shrink_swell: low
    liquefaction_susceptibility: none
    bearing_capacity_kpa: 400
    water_table_depth_m: 15.0
    notes: Thin soils over hard quartzite; most rainfall runs off quickly to the D-7 head and Tekri Nala (R-2).
  - id: SP-RS
    zone_id: Z-RS
    soil_type: alluvial silt and sand
    depth_to_bedrock_m: 22.0
    permeability_class: moderate
    infiltration_rate_mm_h: 15
    field_capacity: 0.28
    plasticity_index: 8
    shrink_swell: low
    liquefaction_susceptibility: moderate
    bearing_capacity_kpa: 90
    water_table_depth_m: 2.0
    notes: Water table rises with Kalinadi stage; loose sands near the D-8 outfall.
  - id: SP-OT
    zone_id: Z-OT
    soil_type: alluvial clay loam
    depth_to_bedrock_m: 18.0
    permeability_class: low
    infiltration_rate_mm_h: 6
    field_capacity: 0.36
    plasticity_index: 18
    shrink_swell: moderate
    liquefaction_susceptibility: low
    bearing_capacity_kpa: 110
    water_table_depth_m: 3.5
