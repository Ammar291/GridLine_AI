dams:
  - id: DM-1
    name: Kalinadi Barrage
    kind: barrage
    river_id: R-1
    channel_id: null
    zone_id: null
    x_m: 400
    y_m: 2760
    year_built: 1985
    height_m: 9
    storage_mcm: 4.2
    spillway_capacity_m3s: 1800
    gates: 12
    condition: fair
    silted_pct: 35
    closes_at_river_stage_m: null
    downstream_zone_ids: [Z-LK, Z-NC, Z-OT, Z-RS, Z-MI]
    operator: Kalinadi Irrigation Division
    description: >-
      Twelve-gate barrage on the Kalinadi (R-1) at the western edge of the city, upstream of every riverine zone. Its
      pond feeds the TU-2 intake tunnel to the water treatment plant (WF-1); during the 2021 flood it released
      1,650 m3/s. About a third of its storage is lost to silt.
  - id: DM-2
    name: Nandi Lake Regulator
    kind: gated_weir
    river_id: R-3
    channel_id: D-11
    zone_id: Z-LK
    x_m: 3000
    y_m: 2350
    year_built: 1996
    height_m: 3.5
    storage_mcm: 1.9
    spillway_capacity_m3s: 40
    gates: 2
    condition: fair
    silted_pct: 20
    closes_at_river_stage_m: 2.5
    downstream_zone_ids: [Z-LK]
    operator: NMC Drainage Division
    description: >-
      Two-gate weir holding Nandi Lake (R-3) and controlling the D-11 outfall to the Kalinadi. The gates close at a
      Kalinadi stage of 2.5 m to stop backflow, after which the basin drains only through the D-11 pumps
      (PU-L1..PU-L3) beside it. Level sensor CL-D11 is mounted on the structure.
  - id: DM-3
    name: Tekri check dams
    kind: check_dam
    river_id: R-2
    channel_id: null
    zone_id: Z-TH
    x_m: 11500
    y_m: 7600
    year_built: 2008
    height_m: 4
    storage_mcm: 0.06
    spillway_capacity_m3s: 25
    gates: 0
    condition: fair
    silted_pct: 60
    closes_at_river_stage_m: null
    downstream_zone_ids: [Z-RS]
    operator: NMC Engineering Department
    description: >-
      A series of ungated gabion check dams on the Tekri Nala (R-2) in the SL-TH-2 gully, built to hold back
      sediment and slow flash runoff towards Riverside. They are now about 60 % silted.

power_substations:
  - id: PS-1
