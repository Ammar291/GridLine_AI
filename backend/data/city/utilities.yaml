    fed_from_substation_id: null
    flood_protected: true
    platform_raised_m: 0
    status: normal
    description: >-
      The city's grid supply point on the Civil Lines Rise (HL-3), feeding the 33/11 kV substations PS-2 to PS-5 and
      directly supplying the District Hospital (H-1) and the water treatment plant (WF-1).
  - id: PS-2
    name: Riverside Substation
    zone_id: Z-RS
