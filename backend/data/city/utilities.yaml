    year_built: 1998
    serves_zone_ids: [Z-RS, Z-HV, Z-TH]
    fed_from_substation_id: PS-1
    flood_protected: false
    platform_raised_m: 0
    status: normal
    description: >-
      Distribution substation on the Riverside flood plain (FP-1) supplying Riverside, Hillview and Tekri Heights,
      including Riverside Community Hospital (H-2) and the raw-water intake WF-2. It was flooded in 2021, causing a
      38-hour outage.
  - id: PS-3
    name: Mill Road Substation
    zone_id: Z-MI
    x_m: 10400
    y_m: 1400
    voltage_kv: "33/11"
    capacity_mva: 60
    year_built: 1980
    serves_zone_ids: [Z-MI]
    fed_from_substation_id: PS-1
    flood_protected: false
    platform_raised_m: 0
    status: normal
    description: >-
      Industrial substation on Mill Road (RD-08) supplying Mill Road Industrial, the Workers' Hospital (H-5) and the
      sewage treatment plant (WF-6). A partial flood bund was added in 2022 but does not enclose the whole site.
  - id: PS-4
    name: Station Road Substation
    zone_id: Z-SR
    x_m: 3000
    y_m: 5400
    voltage_kv: "33/11"
    capacity_mva: 50
    year_built: 1965
    serves_zone_ids: [Z-SR, Z-OT, Z-MW]
    fed_from_substation_id: PS-1
    flood_protected: true
    platform_raised_m: 0
    status: normal
    description: >-
      The oldest distribution substation, on the older alluvial terrace in Station Road, supplying Station Road, Old
      Town and Market Ward, including the Railway Hospital and the Old Town overhead tanks (WF-4).
  - id: PS-5
    name: New Colony Substation
    zone_id: Z-NC
    x_m: 5200
    y_m: 1000
    voltage_kv: "33/11"
    capacity_mva: 40
    year_built: 2021
    serves_zone_ids: [Z-NC, Z-LK]
    fed_from_substation_id: PS-1
    flood_protected: true
    platform_raised_m: 1.2
    status: normal
