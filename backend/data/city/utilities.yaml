      Commissioned in 2021 on a platform raised 1.2 m above the South Bank plain (FP-2). It supplies New Colony and
      Lakeside, including the D-11 pumps (PU-L1..PU-L3), Lakeview Hospital (H-4) and the booster station WF-5.

