- id: RA-01
  name: Hillview Terrace Phase 1
  zone_id: Z-HV
  kind: apartment_blocks
  households: 3581
  population: 15400
  year_established: 2022
  storeys: 5
  building_quality: good
  slope_id: SL-HV-2
  flood_plain_id: null
  nearest_channel_id: D-7
  distance_to_channel_m: 140
  x_m: 9350
  y_m: 5150
  description: Apartment blocks of Hillview Terrace Phase 1 (about 3,200 residents, occupied 2022 after project
    PR-HT1) and the older terraced lanes of the lower Hillview ridge around them, on slope SL-HV-2 behind its 2022
    retaining wall. Reached only by Hill Road (RD-01); drains to D-7 about 140 m downslope.

- id: RA-02
  name: Kalinadi Drain settlement
  zone_id: Z-HV
  kind: informal_settlement
  households: 605
  population: 2600
  year_established: 1995
  storeys: 1
  building_quality: poor
  slope_id: null
  flood_plain_id: null
  nearest_channel_id: D-7
  distance_to_channel_m: 5
  x_m: 9600
  y_m: 4700
  description: Informal settlement on the banks of the upper reach of D-7 just upstream of the BR-4 culvert on Hill
    Road (RD-01); grew from about 1,900 to 2,600 people in 2026 and was flooded 0.6 m in 2025.

- id: RA-03
  name: Riverside Old Village
  zone_id: Z-RS
  kind: row_houses
  households: 5116
  population: 22000
  year_established: 1880
  storeys: 2
  building_quality: fair
  slope_id: null
  flood_plain_id: FP-1
  nearest_channel_id: D-7
  distance_to_channel_m: 200
  x_m: 9400
  y_m: 3800
  description: Old village core of Riverside on flood plain FP-1 between the Riverside Bypass (RD-02) and the lower
    D-7; ponded 0.5 m in 2019 when a landslide blocked D-7. Supplied from WF-2 and powered from PS-2.

- id: RA-04
