[project]
name = "gridline"
version = "0.1.0"
description = "GridLine AI - City Disaster Intelligence Brain for the fictional city of Nandipur"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "fastembed>=0.7",
]

[project.scripts]
gridline-ingest = "gridline.rag.ingest:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pyright>=1.1.400",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gridline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.pyright]
include = ["gridline"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
