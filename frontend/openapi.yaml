# Interim GridLine AI contract (frontend view).
# Hand-written from ARCHITECTURE.md section 12 plus the additions in the frontend spec section 9.
# When the backend exposes /openapi.json it replaces this file as the input to `npm run gen:api`;
# component names must stay the same so the frontend compiles unchanged.
openapi: 3.1.0
info:
  title: GridLine AI
  version: 0.1.0-interim
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /api/llm/status:
    get:
      operationId: getLlmStatus
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LlmStatus' } } } }
  /api/city:
    get:
      operationId: getCity
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/City' } } } }
  /api/events:
    get:
      operationId: listEvents
      parameters:
        - { name: since, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/EventType' } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } }
  /api/incidents:
    get:
      operationId: listIncidents
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IncidentSummary' } } } }
  /api/incidents/{incident_id}:
    get:
      operationId: getIncident
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Incident' } } } }
  /api/approvals:
    get:
      operationId: listApprovals
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/ApprovalStatus' } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Approval' } } } }
  /api/approvals/{approval_id}/decide:
    post:
      operationId: decideApproval
      parameters:
        - { name: approval_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDecision' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Approval' } } } }
  /api/actions:
    get:
      operationId: listActions
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Action' } } } }
  /api/actions/{action_id}:
    get:
      operationId: getAction
      parameters:
        - { name: action_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Action' } } } }
  /api/documents/{doc_id}:
    get:
      operationId: getDocument
      parameters:
        - { name: doc_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
  /api/chunks/{chunk_id}:
    get:
      operationId: getChunk
      parameters:
        - { name: chunk_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Chunk' } } } }
  /api/simulation/start:
    post:
      operationId: startSimulation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SimulationStart' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SimStatus' } } } }
  /api/simulation/pause:
    post:
      operationId: pauseSimulation
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SimStatus' } } } }
  /api/simulation/resume:
    post:
      operationId: resumeSimulation
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SimStatus' } } } }
  /api/simulation/reset:
    post:
      operationId: resetSimulation
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SimStatus' } } } }
  /api/simulation/speed:
    post:
      operationId: setSimulationSpeed
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SimulationSpeed' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SimStatus' } } } }
  /api/simulation/inject:
    post:
      operationId: injectScenarioEvent
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/InjectEvent' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SimStatus' } } } }

components:
  schemas:
    # ---- status ----
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
    LlmStatus:
      type: object
      required: [provider, model]
      properties:
        provider: { type: string, enum: [anthropic, mock, none] }
        model: { type: [string, 'null'] }

    # ---- city ----
    XY:
      type: object
      required: [x, y]
      properties: { x: { type: number }, y: { type: number } }
    ViewBox:
      type: object
      required: [x, y, width, height]
      properties: { x: { type: number }, y: { type: number }, width: { type: number }, height: { type: number } }
    Band: { type: string, enum: [normal, watch, warning, critical] }
    Hazard: { type: string, enum: [landslide, flood] }
    ZoneState:
      type: object
      required: [saturation, rain_24h_mm, rain_intensity_mm_h, landslide_index, flood_index, band, updated_sim_time]
      properties:
        saturation: { type: number }
        rain_24h_mm: { type: number }
        rain_intensity_mm_h: { type: number }
        landslide_index: { type: number }
        flood_index: { type: number }
        band: { $ref: '#/components/schemas/Band' }
        updated_sim_time: { type: string }
    Zone:
      type: object
      required: [id, name, slope_deg, soil_type, population, svg_path, label_xy, state]
      properties:
        id: { type: string }
        name: { type: string }
        slope_deg: { type: number }
        soil_type: { type: string }
        population: { type: integer }
        drains_to_channel_id: { type: [string, 'null'] }
        svg_path: { type: string }
        label_xy: { $ref: '#/components/schemas/XY' }
        state: { $ref: '#/components/schemas/ZoneState' }
    Road:
      type: object
      required: [id, name, zone_ids, status, is_evacuation_route, is_bridge, svg_path]
      properties:
        id: { type: string }
        name: { type: string }
        zone_ids: { type: array, items: { type: string } }
        status: { type: string, enum: [open, closed] }
        is_evacuation_route: { type: boolean }
        is_bridge: { type: boolean }
        svg_path: { type: string }
    Channel:
      type: object
      required: [id, name, design_capacity_m3s, current_capacity_m3s, blocked_fraction, svg_path]
      properties:
        id: { type: string }
        name: { type: string }
        design_capacity_m3s: { type: number }
        current_capacity_m3s: { type: number }
        blocked_fraction: { type: number }
        downstream_zone_id: { type: [string, 'null'] }
        svg_path: { type: string }
    Project:
      type: object
      required: [id, name, zone_id, status, excavation_depth_m, planned_depth_m, permit_doc_id, xy]
      properties:
        id: { type: string }
        name: { type: string }
        zone_id: { type: string }
        status: { type: string, enum: [active, halted] }
        excavation_depth_m: { type: number }
        planned_depth_m: { type: number }
        # Nullable: several synthetic projects in the backend seed carry no permit document.
        permit_doc_id: { type: [string, 'null'] }
        xy: { $ref: '#/components/schemas/XY' }
    Sensor:
      type: object
      required: [id, kind, zone_id, unit, xy]
      properties:
        id: { type: string }
        kind: { type: string, enum: [rain, soil, channel] }
        zone_id: { type: string }
        unit: { type: string }
        xy: { $ref: '#/components/schemas/XY' }
        last_value: { type: [number, 'null'] }
        last_sim_time: { type: [string, 'null'] }
    Crew:
      type: object
      required: [id, name, status, location_zone_id, xy]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [available, dispatched, en_route, on_site, blocked] }
        location_zone_id: { type: string }
        target_zone_id: { type: [string, 'null'] }
        task: { type: [string, 'null'] }
        xy: { $ref: '#/components/schemas/XY' }
    Shelter:
      type: object
      required: [id, name, status, capacity, occupancy, zone_id, xy]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [open, closed] }
        capacity: { type: integer }
        occupancy: { type: integer }
        zone_id: { type: string }
        xy: { $ref: '#/components/schemas/XY' }
    PumpUnit:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [at_depot, deployed] }
        channel_id: { type: [string, 'null'] }
    PumpDepot:
      type: object
      required: [zone_id, xy, units]
      properties:
        zone_id: { type: string }
        xy: { $ref: '#/components/schemas/XY' }
        units: { type: array, items: { $ref: '#/components/schemas/PumpUnit' } }
    Hospital:
      type: object
      required: [id, name, zone_id, beds, xy]
      properties:
        id: { type: string }
        name: { type: string }
        zone_id: { type: string }
        beds: { type: integer }
        xy: { $ref: '#/components/schemas/XY' }
    MapFeature:
      type: object
      required: [id, kind, svg_path]
      properties:
        id: { type: string }
        kind: { type: string, enum: [river, hill_contour, lake, label] }
        svg_path: { type: string }
        label: { type: [string, 'null'] }
    BandThresholds:
      type: object
      required: [watch, warning, critical]
      properties: { watch: { type: number }, warning: { type: number }, critical: { type: number } }
    Bands:
      type: object
      required: [landslide, flood]
      properties:
        landslide: { $ref: '#/components/schemas/BandThresholds' }
        flood: { $ref: '#/components/schemas/BandThresholds' }
    Injection:
      type: object
      required: [id, label]
      properties: { id: { type: string }, label: { type: string } }
    Scenario:
      type: object
      required: [id, name, injections]
      properties:
        id: { type: string }
        name: { type: string }
        injections: { type: array, items: { $ref: '#/components/schemas/Injection' } }
    City:
      type: object
      required: [view_box, zones, roads, channels, projects, sensors, crews, shelters, pump_depot, hospitals, map_features, bands, scenarios]
      properties:
        view_box: { $ref: '#/components/schemas/ViewBox' }
        zones: { type: array, items: { $ref: '#/components/schemas/Zone' } }
        roads: { type: array, items: { $ref: '#/components/schemas/Road' } }
        channels: { type: array, items: { $ref: '#/components/schemas/Channel' } }
        projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
        sensors: { type: array, items: { $ref: '#/components/schemas/Sensor' } }
        crews: { type: array, items: { $ref: '#/components/schemas/Crew' } }
        shelters: { type: array, items: { $ref: '#/components/schemas/Shelter' } }
        pump_depot: { $ref: '#/components/schemas/PumpDepot' }
        hospitals: { type: array, items: { $ref: '#/components/schemas/Hospital' } }
        map_features: { type: array, items: { $ref: '#/components/schemas/MapFeature' } }
        bands: { $ref: '#/components/schemas/Bands' }
        scenarios: { type: array, items: { $ref: '#/components/schemas/Scenario' } }

    # ---- reasoning ----
    Citation:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string }
        kind: { type: string, enum: [chunk, sensor, state, event] }
        label: { type: string }
    Claim:
      type: object
      required: [text, citation_ids]
      properties:
        text: { type: string }
        citation_ids: { type: array, items: { type: string } }
    ContributingFactor:
      type: object
      required: [factor, value, citation_ids]
      properties:
        factor: { type: string }
        value: { type: string }
        citation_ids: { type: array, items: { type: string } }
    CitySnapshotReadings:
      type: object
      required: [rain_intensity_mm_h, rain_24h_mm, saturation, landslide_index, flood_index, band]
      properties:
        rain_intensity_mm_h: { type: number }
        rain_24h_mm: { type: number }
        saturation: { type: number }
        landslide_index: { type: number }
        flood_index: { type: number }
        band: { $ref: '#/components/schemas/Band' }
    SnapshotProject:
      type: object
      required: [id, name, status, excavation_depth_m, planned_depth_m]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        excavation_depth_m: { type: number }
        planned_depth_m: { type: number }
    SnapshotChannel:
      type: object
      required: [id, name, current_capacity_m3s, design_capacity_m3s, blocked_fraction]
      properties:
        id: { type: string }
        name: { type: string }
        current_capacity_m3s: { type: number }
        design_capacity_m3s: { type: number }
        blocked_fraction: { type: number }
    SnapshotCrew:
      type: object
      required: [id, name, status, location_zone_id]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string }
        location_zone_id: { type: string }
    CitySnapshot:
      type: object
      required: [node, zone_id, sim_time, readings, crews, open_roads, closed_roads, downstream_zone_ids]
      properties:
        node: { type: string, enum: [observe] }
        zone_id: { type: string }
        sim_time: { type: string }
        readings: { $ref: '#/components/schemas/CitySnapshotReadings' }
        project:
          oneOf: [{ $ref: '#/components/schemas/SnapshotProject' }, { type: 'null' }]
        channel:
          oneOf: [{ $ref: '#/components/schemas/SnapshotChannel' }, { type: 'null' }]
        crews: { type: array, items: { $ref: '#/components/schemas/SnapshotCrew' } }
        open_roads: { type: array, items: { type: string } }
        closed_roads: { type: array, items: { type: string } }
        downstream_zone_ids: { type: array, items: { type: string } }
    RetrievedChunk:
      type: object
      required: [id, doc_id, doc_title, section, kind, score]
      properties:
        id: { type: string }
        doc_id: { type: string }
        doc_title: { type: string }
        section: { type: string }
        kind: { type: string }
        score: { type: number }
    RetrievedChunks:
      type: object
      required: [node, chunks]
      properties:
        node: { type: string, enum: [retrieve] }
        chunks: { type: array, items: { $ref: '#/components/schemas/RetrievedChunk' } }
    ThreatAssessment:
      type: object
      required: [node, hazard, summary, contributing_factors, confidence, claims]
      properties:
        node: { type: string, enum: [assess] }
        hazard: { $ref: '#/components/schemas/Hazard' }
        summary: { type: string }
        contributing_factors: { type: array, items: { $ref: '#/components/schemas/ContributingFactor' } }
        confidence: { type: number }
        claims: { type: array, items: { $ref: '#/components/schemas/Claim' } }
    RiskPrediction:
      type: object
      required: [node, probability_band, time_horizon, what_would_change_it, claims]
      properties:
        node: { type: string, enum: [predict] }
        probability_band: { type: string, enum: [low, moderate, high, very_high] }
        time_horizon: { type: string }
        onset_sim_time: { type: [string, 'null'] }
        what_would_change_it: { type: array, items: { type: string } }
        claims: { type: array, items: { $ref: '#/components/schemas/Claim' } }
    CascadeLink:
      type: object
      required: [cause, effect, affected_asset_ids, citation_ids]
      properties:
        cause: { type: string }
        effect: { type: string }
        affected_asset_ids: { type: array, items: { type: string } }
        citation_ids: { type: array, items: { type: string } }
    CascadeAnalysis:
      type: object
      required: [node, chain, affected_zone_ids, claims]
      properties:
        node: { type: string, enum: [cascade] }
        chain: { type: array, items: { $ref: '#/components/schemas/CascadeLink' } }
        affected_zone_ids: { type: array, items: { type: string } }
        claims: { type: array, items: { $ref: '#/components/schemas/Claim' } }
    ProposedAction:
      type: object
      required: [action_id, tool, input, rationale, expected_effect, citation_ids, requires_approval]
      properties:
        action_id: { type: string }
        tool: { type: string }
        input: { type: object, additionalProperties: true }
        rationale: { type: string }
        expected_effect: { type: string }
        citation_ids: { type: array, items: { type: string } }
        requires_approval: { type: boolean }
    ActionPlan:
      type: object
      required: [node, actions]
      properties:
        node: { type: string, enum: [recommend] }
        actions: { type: array, items: { $ref: '#/components/schemas/ProposedAction' } }
    ApprovalGateResult:
      type: object
      required: [node, auto_approved_action_ids, pending_action_ids]
      properties:
        node: { type: string, enum: [approval_gate] }
        approval_id: { type: [string, 'null'] }
        auto_approved_action_ids: { type: array, items: { type: string } }
        pending_action_ids: { type: array, items: { type: string } }
    ExecuteResult:
      type: object
      required: [node, action_ids]
      properties:
        node: { type: string, enum: [execute] }
        action_ids: { type: array, items: { type: string } }
    PerActionVerification:
      type: object
      required: [action_id, status, expected, observed, failures]
      properties:
        action_id: { type: string }
        status: { type: string, enum: [verified, partially_verified, failed, pending] }
        expected: { type: string }
        observed: { type: string }
        failures: { type: array, items: { type: string } }
    VerificationResult:
      type: object
      required: [node, status, per_action]
      properties:
        node: { type: string, enum: [verify] }
        status: { type: string, enum: [verified, partially_verified, failed] }
        per_action: { type: array, items: { $ref: '#/components/schemas/PerActionVerification' } }
    ReplanResult:
      type: object
      required: [node, reason]
      properties:
        node: { type: string, enum: [replan] }
        reason: { type: string }
    StepOutput:
      oneOf:
        - { $ref: '#/components/schemas/CitySnapshot' }
        - { $ref: '#/components/schemas/RetrievedChunks' }
        - { $ref: '#/components/schemas/ThreatAssessment' }
        - { $ref: '#/components/schemas/RiskPrediction' }
        - { $ref: '#/components/schemas/CascadeAnalysis' }
        - { $ref: '#/components/schemas/ActionPlan' }
        - { $ref: '#/components/schemas/ApprovalGateResult' }
        - { $ref: '#/components/schemas/ExecuteResult' }
        - { $ref: '#/components/schemas/VerificationResult' }
        - { $ref: '#/components/schemas/ReplanResult' }
      discriminator:
        propertyName: node
        mapping:
          observe: '#/components/schemas/CitySnapshot'
          retrieve: '#/components/schemas/RetrievedChunks'
          assess: '#/components/schemas/ThreatAssessment'
          predict: '#/components/schemas/RiskPrediction'
          cascade: '#/components/schemas/CascadeAnalysis'
          recommend: '#/components/schemas/ActionPlan'
          approval_gate: '#/components/schemas/ApprovalGateResult'
          execute: '#/components/schemas/ExecuteResult'
          verify: '#/components/schemas/VerificationResult'
          replan: '#/components/schemas/ReplanResult'
    NodeName: { type: string, enum: [observe, retrieve, assess, predict, cascade, recommend, approval_gate, execute, verify, replan] }
    AgentStep:
      type: object
      required: [id, run_id, node, status, started_at, output, citations]
      properties:
        id: { type: string }
        run_id: { type: string }
        node: { $ref: '#/components/schemas/NodeName' }
        status: { type: string, enum: [running, finished, ungrounded, failed] }
        started_at: { type: string }
        finished_at: { type: [string, 'null'] }
        duration_ms: { type: [number, 'null'] }
        output:
          oneOf: [{ $ref: '#/components/schemas/StepOutput' }, { type: 'null' }]
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
    AgentRun:
      type: object
      required: [id, incident_id, thread_id, trigger, status, started_at, steps]
      properties:
        id: { type: string }
        incident_id: { type: string }
        thread_id: { type: string }
        trigger: { type: string }
        replan_reason: { type: [string, 'null'] }
        status: { type: string, enum: [running, waiting_approval, finished, failed] }
        started_at: { type: string }
        finished_at: { type: [string, 'null'] }
        steps: { type: array, items: { $ref: '#/components/schemas/AgentStep' } }

    # ---- approvals and actions ----
    ApprovalStatus: { type: string, enum: [pending, approved, rejected, partial] }
    Approval:
      type: object
      required: [id, run_id, incident_id, proposed_actions, status, requested_at, approved_action_ids, synthetic]
      properties:
        id: { type: string }
        run_id: { type: string }
        incident_id: { type: string }
        proposed_actions: { type: array, items: { $ref: '#/components/schemas/ProposedAction' } }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        requested_at: { type: string }
        decided_at: { type: [string, 'null'] }
        decided_by: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        approved_action_ids: { type: array, items: { type: string } }
        synthetic: { type: boolean }
    ApprovalDecision:
      type: object
      required: [decision, approved_action_ids]
      properties:
        decision: { type: string, enum: [approve, reject, partial] }
        approved_action_ids: { type: array, items: { type: string } }
        note: { type: [string, 'null'] }
    StateChange:
      type: object
      required: [entity_type, entity_id, entity_name, field, from, to]
      properties:
        entity_type: { type: string, enum: [crew, shelter, road, project, channel, pump_unit, alert] }
        entity_id: { type: string }
        entity_name: { type: string }
        field: { type: string }
        from: { type: string }
        to: { type: string }
    ActionVerification:
      type: object
      required: [status, expected, observed, failures]
      properties:
        status: { type: string, enum: [verified, partially_verified, failed, pending] }
        expected: { type: string }
        observed: { type: string }
        failures: { type: array, items: { type: string } }
        checked_sim_time: { type: [string, 'null'] }
    ActionStatus: { type: string, enum: [pending, executing, executed, failed] }
    Action:
      type: object
      required: [id, run_id, incident_id, tool, input, status, state_changes]
      properties:
        id: { type: string }
        run_id: { type: string }
        incident_id: { type: string }
        tool: { type: string }
        input: { type: object, additionalProperties: true }
        status: { $ref: '#/components/schemas/ActionStatus' }
        executed_at: { type: [string, 'null'] }
        executed_sim_time: { type: [string, 'null'] }
        state_changes: { type: array, items: { $ref: '#/components/schemas/StateChange' } }
        verification:
          oneOf: [{ $ref: '#/components/schemas/ActionVerification' }, { type: 'null' }]
    Alert:
      type: object
      required: [id, zone_id, level, message, issued_at, issued_sim_time]
      properties:
        id: { type: string }
        zone_id: { type: string }
        level: { type: string, enum: [advisory, warning, evacuate] }
        message: { type: string }
        issued_at: { type: string }
        issued_sim_time: { type: string }

    # ---- incidents ----
    IncidentStatus: { type: string, enum: [open, closed] }
    IncidentSummary:
      type: object
      required: [id, zone_id, hazard, band, status, opened_at, opened_sim_time, run_count, pending_approval_count]
      properties:
        id: { type: string }
        zone_id: { type: string }
        hazard: { $ref: '#/components/schemas/Hazard' }
        band: { $ref: '#/components/schemas/Band' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        opened_at: { type: string }
        opened_sim_time: { type: string }
        closed_at: { type: [string, 'null'] }
        run_count: { type: integer }
        pending_approval_count: { type: integer }
    Incident:
      type: object
      required: [id, zone_id, hazard, band, status, opened_at, opened_sim_time, runs, approvals, actions]
      properties:
        id: { type: string }
        zone_id: { type: string }
        hazard: { $ref: '#/components/schemas/Hazard' }
        band: { $ref: '#/components/schemas/Band' }
        status: { $ref: '#/components/schemas/IncidentStatus' }
        opened_at: { type: string }
        opened_sim_time: { type: string }
        closed_at: { type: [string, 'null'] }
        runs: { type: array, items: { $ref: '#/components/schemas/AgentRun' } }
        approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        actions: { type: array, items: { $ref: '#/components/schemas/Action' } }

    # ---- sources ----
    Chunk:
      type: object
      required: [id, doc_id, doc_title, section, kind, text, metadata]
      properties:
        id: { type: string }
        doc_id: { type: string }
        doc_title: { type: string }
        section: { type: string }
        kind: { type: string }
        text: { type: string }
        metadata: { type: object, additionalProperties: true }
    DocumentSection:
      type: object
      required: [id, heading, text]
      properties: { id: { type: string }, heading: { type: string }, text: { type: string } }
    Document:
      type: object
      required: [id, title, kind, sections]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string }
        sections: { type: array, items: { $ref: '#/components/schemas/DocumentSection' } }

    # ---- simulation ----
    SimStatus:
      type: object
      required: [scenario, running, speed, sim_time, tick]
      properties:
        scenario: { type: [string, 'null'] }
        running: { type: boolean }
        speed: { type: number }
        sim_time: { type: [string, 'null'] }
        tick: { type: integer }
    SimulationStart:
      type: object
      required: [scenario, speed]
      properties:
        scenario: { type: string }
        speed: { type: number }
        seed: { type: integer }
    SimulationSpeed:
      type: object
      required: [speed]
      properties: { speed: { type: number } }
    InjectEvent:
      type: object
      required: [id]
      properties: { id: { type: string } }
    StateSnapshot:
      type: object
      required: [city, sim, llm, incidents, approvals, actions, alerts]
      properties:
        city: { $ref: '#/components/schemas/City' }
        sim: { $ref: '#/components/schemas/SimStatus' }
        llm: { $ref: '#/components/schemas/LlmStatus' }
        incidents: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        actions: { type: array, items: { $ref: '#/components/schemas/Action' } }
        alerts: { type: array, items: { $ref: '#/components/schemas/Alert' } }

    # ---- events ----
    EventType:
      type: string
      enum:
        - state.snapshot
        - sim.tick
        - sensor.reading
        - zone.state
        - threat.detected
        - threat.escalated
        - incident.opened
        - incident.closed
        - agent.run.started
        - agent.run.finished
        - agent.node.started
        - agent.node.finished
        - approval.requested
        - approval.decided
        - action.executed
        - action.verified
        - replan.triggered
        - alert.issued
        - scenario.event
    EventBase:
      type: object
      required: [id, ts, sim_time]
      properties:
        id: { type: string }
        ts: { type: string }
        sim_time: { type: [string, 'null'] }
        incident_id: { type: [string, 'null'] }
    SimTickPayload:
      type: object
      required: [sim_time, tick, running, speed]
      properties:
        sim_time: { type: string }
        tick: { type: integer }
        running: { type: boolean }
        speed: { type: number }
    SensorReadingPayload:
      type: object
      required: [sensor_id, kind, zone_id, value, unit]
      properties:
        sensor_id: { type: string }
        kind: { type: string, enum: [rain, soil, channel] }
        zone_id: { type: string }
        value: { type: number }
        unit: { type: string }
    ZoneStatePayload:
      allOf:
        - { $ref: '#/components/schemas/ZoneState' }
        - type: object
          required: [zone_id]
          properties:
            zone_id: { type: string }
            prev_band:
              oneOf: [{ $ref: '#/components/schemas/Band' }, { type: 'null' }]
    ThreatPayload:
      type: object
      required: [incident_id, zone_id, hazard, band, index]
      properties:
        incident_id: { type: string }
        zone_id: { type: string }
        hazard: { $ref: '#/components/schemas/Hazard' }
        band: { $ref: '#/components/schemas/Band' }
        prev_band:
          oneOf: [{ $ref: '#/components/schemas/Band' }, { type: 'null' }]
        index: { type: number }
    NodeStartedPayload:
      type: object
      required: [run_id, incident_id, node, step_id]
      properties:
        run_id: { type: string }
        incident_id: { type: string }
        node: { $ref: '#/components/schemas/NodeName' }
        step_id: { type: string }
    ActionVerifiedPayload:
      type: object
      required: [action_id, verification]
      properties:
        action_id: { type: string }
        verification: { $ref: '#/components/schemas/ActionVerification' }
    ReplanPayload:
      type: object
      required: [incident_id, run_id, reason]
      properties:
        incident_id: { type: string }
        run_id: { type: string }
        reason: { type: string }
    ScenarioEventPayload:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }

    StateSnapshotEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [state.snapshot] }
            payload: { $ref: '#/components/schemas/StateSnapshot' }
    SimTickEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [sim.tick] }
            payload: { $ref: '#/components/schemas/SimTickPayload' }
    SensorReadingEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [sensor.reading] }
            payload: { $ref: '#/components/schemas/SensorReadingPayload' }
    ZoneStateEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [zone.state] }
            payload: { $ref: '#/components/schemas/ZoneStatePayload' }
    ThreatDetectedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [threat.detected] }
            payload: { $ref: '#/components/schemas/ThreatPayload' }
    ThreatEscalatedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [threat.escalated] }
            payload: { $ref: '#/components/schemas/ThreatPayload' }
    IncidentOpenedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [incident.opened] }
            payload: { $ref: '#/components/schemas/Incident' }
    IncidentClosedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [incident.closed] }
            payload: { $ref: '#/components/schemas/Incident' }
    AgentRunStartedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [agent.run.started] }
            payload: { $ref: '#/components/schemas/AgentRun' }
    AgentRunFinishedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [agent.run.finished] }
            payload: { $ref: '#/components/schemas/AgentRun' }
    AgentNodeStartedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [agent.node.started] }
            payload: { $ref: '#/components/schemas/NodeStartedPayload' }
    AgentNodeFinishedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [agent.node.finished] }
            payload: { $ref: '#/components/schemas/AgentStep' }
    ApprovalRequestedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [approval.requested] }
            payload: { $ref: '#/components/schemas/Approval' }
    ApprovalDecidedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [approval.decided] }
            payload: { $ref: '#/components/schemas/Approval' }
    ActionExecutedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [action.executed] }
            payload: { $ref: '#/components/schemas/Action' }
    ActionVerifiedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [action.verified] }
            payload: { $ref: '#/components/schemas/ActionVerifiedPayload' }
    ReplanTriggeredEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [replan.triggered] }
            payload: { $ref: '#/components/schemas/ReplanPayload' }
    AlertIssuedEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [alert.issued] }
            payload: { $ref: '#/components/schemas/Alert' }
    ScenarioEvent:
      allOf:
        - { $ref: '#/components/schemas/EventBase' }
        - type: object
          required: [type, payload]
          properties:
            type: { type: string, enum: [scenario.event] }
            payload: { $ref: '#/components/schemas/ScenarioEventPayload' }
    Event:
      oneOf:
        - { $ref: '#/components/schemas/StateSnapshotEvent' }
        - { $ref: '#/components/schemas/SimTickEvent' }
        - { $ref: '#/components/schemas/SensorReadingEvent' }
        - { $ref: '#/components/schemas/ZoneStateEvent' }
        - { $ref: '#/components/schemas/ThreatDetectedEvent' }
        - { $ref: '#/components/schemas/ThreatEscalatedEvent' }
        - { $ref: '#/components/schemas/IncidentOpenedEvent' }
        - { $ref: '#/components/schemas/IncidentClosedEvent' }
        - { $ref: '#/components/schemas/AgentRunStartedEvent' }
        - { $ref: '#/components/schemas/AgentRunFinishedEvent' }
        - { $ref: '#/components/schemas/AgentNodeStartedEvent' }
        - { $ref: '#/components/schemas/AgentNodeFinishedEvent' }
        - { $ref: '#/components/schemas/ApprovalRequestedEvent' }
        - { $ref: '#/components/schemas/ApprovalDecidedEvent' }
        - { $ref: '#/components/schemas/ActionExecutedEvent' }
        - { $ref: '#/components/schemas/ActionVerifiedEvent' }
        - { $ref: '#/components/schemas/ReplanTriggeredEvent' }
        - { $ref: '#/components/schemas/AlertIssuedEvent' }
        - { $ref: '#/components/schemas/ScenarioEvent' }
      discriminator:
        propertyName: type
        mapping:
          state.snapshot: '#/components/schemas/StateSnapshotEvent'
          sim.tick: '#/components/schemas/SimTickEvent'
          sensor.reading: '#/components/schemas/SensorReadingEvent'
          zone.state: '#/components/schemas/ZoneStateEvent'
          threat.detected: '#/components/schemas/ThreatDetectedEvent'
          threat.escalated: '#/components/schemas/ThreatEscalatedEvent'
          incident.opened: '#/components/schemas/IncidentOpenedEvent'
          incident.closed: '#/components/schemas/IncidentClosedEvent'
          agent.run.started: '#/components/schemas/AgentRunStartedEvent'
          agent.run.finished: '#/components/schemas/AgentRunFinishedEvent'
          agent.node.started: '#/components/schemas/AgentNodeStartedEvent'
          agent.node.finished: '#/components/schemas/AgentNodeFinishedEvent'
          approval.requested: '#/components/schemas/ApprovalRequestedEvent'
          approval.decided: '#/components/schemas/ApprovalDecidedEvent'
          action.executed: '#/components/schemas/ActionExecutedEvent'
          action.verified: '#/components/schemas/ActionVerifiedEvent'
          replan.triggered: '#/components/schemas/ReplanTriggeredEvent'
          alert.issued: '#/components/schemas/AlertIssuedEvent'
          scenario.event: '#/components/schemas/ScenarioEvent'
