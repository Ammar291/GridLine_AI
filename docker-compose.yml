services:
  db:
    image: pgvector/pgvector:pg16
    container_name: gridline-db
    environment:
      POSTGRES_USER: gridline
      POSTGRES_PASSWORD: gridline
      POSTGRES_DB: gridline
    ports:
      - "${GRIDLINE_DB_PORT:-5433}:5432"
    volumes:
      - gridline-pgdata:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridline -d gridline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gridline-pgdata:
